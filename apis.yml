name: Simular
description: >-
  Simular is the autonomous computer company. It builds AI agents that operate
  computers the way people do — clicking, typing, scrolling, and navigating
  GUIs, APIs, terminals, and code. Its flagship product Sai is a 24/7 AI
  co-worker that runs on private cloud desktops, and it maintains the
  open-source Agent-S agentic framework, the OpenACI agent-computer interface,
  and Simulang, a desktop-automation scripting language with Python (pysimular),
  Node.js (@simular-ai/simulang-js), and CLI (@simular-ai/simulang) surfaces.
  Developers integrate Simular through these SDKs and a Claude Code /simulang
  skill rather than a hosted HTTP API. Simular is backed by Felicis.
